name: CI
on:
  push:
    branches: [main]            # run when main changes (e.g. a PR is merged)
  pull_request:                 # run on every pull request; covers pushes to PR branches
jobs:
  build:
    runs-on: ubuntu-latest       # a fresh Linux VM provided free by GitHub
    steps:
      - uses: actions/checkout@v4          # get your code
      - uses: actions/setup-dotnet@v4      # install .NET
        with: { global-json-file: global.json }   # the version you pinned
      - run: dotnet build
      - run: dotnet test
